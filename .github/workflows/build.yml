name: Drakes-Suites Continuous Integration

on:
  push:
    branches: [ main, master, 26.x ]
  pull_request:
    branches: [ main, master, 26.x ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar Reactor Drakes-Suites (StarSuites Monorepo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 25 para la rama 26.x
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y Ejecutar Tests del Monorepo
        run: mvn -B -ntp -Ppurpur-26 clean package

      - name: Subir Artefactos JARs Compilados
        uses: actions/upload-artifact@v4
        with:
          name: starsuites-jars
          path: |
            */target/*.jar
            !*/target/original-*.jar
          retention-days: 14
