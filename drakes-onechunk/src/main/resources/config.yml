# Off by default: enable only in the isolated Season 2 OneChunk world after a backup.
enabled: false
# Must match AOneBlock's configured world name in the isolated Season 2 instance.
world: onechunk_world
min-y: -64
max-y: 319
blocks-per-tick: 512

# This is the finite source column, not a respawning magic block. Each entry
# describes a horizontal layer and repeats only while the column is generated.
progression:
  - DEEPSLATE
  - STONE
  - TUFF
  - COBBLESTONE
  - DIRT
  - GRASS_BLOCK
