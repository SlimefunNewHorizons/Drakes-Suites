name: DrakesCore
load: STARTUP
softdepend: [Vault]
loadbefore: [DeluxeMenus, UltimateShop, CrazyAuctions, DrakesSlimeMarket, DrakesServer, AuraSkills, ItemEdit, SlotMachine, FNAmplifications, Jobs, Quests, QuickShop-Hikari, Odysseia, sBank]
version: '${project.version}'
main: com.drakescraft.suites.core.DrakesCorePlugin
api-version: '${plugin.api.version}'
author: SlimefunNewHorizons
description: "Kernel del Ecosistema DrakesCraft: Core Engine, API, Modular Loader y Ticker Centralizado."

commands:
  drakessuites:
    description: Administra las 8 Mega-Suites de DrakesCraft
    permission: drakes.suites.admin
    aliases: [drakes, suites, dsuite]
  balance:
    description: Check your Dracmas balance via Vault/InvSwitcher
    permission: drakes.economy.balance
    aliases: [bal, money]
  pay:
    description: Transfer Dracmas to another player via Vault/InvSwitcher
    permission: drakes.economy.pay
  eco:
    description: Administer player Dracmas via Vault/InvSwitcher
    permission: drakes.economy.admin
