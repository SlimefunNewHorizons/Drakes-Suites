# DrakesCore - Configuración Maestra del Kernel y Aislamiento de Modalidades

# 1. Filtro de Mundos para Slimefun (Exclusión estricta de Slimefun en modalidades como Survival Clásico)
slimefun:
  disabled-worlds:
    - "world_clasico"
    - "world_clasico_nether"
    - "world_clasico_the_end"
  restriction-message: "<red>❌ Slimefun technology and magic are strictly disabled in Classic Survival.</red>"

# 2. Command Modality Gate (Separación de comandos por modalidad)
command-gate:
  enabled: true
  rules:
    clasico:
      world-patterns:
        - "^world_clasico.*"
      blocked-commands:
        - "/sf"
        - "/slimefun"
        - "/guide"
        - "/researches"
        - "/sfcalc"
        - "/slimehud"
        - "/bosswarp"
      blocked-message: "<red>❌ The command <yellow>{command}</yellow> is not available in <white>Classic Survival</white>.</red>"
    oneblock:
      world-patterns:
        - "^world_oneblock.*"
      blocked-commands:
        - "/is"
      blocked-message: "<red>❌ In OneBlock, use <yellow>/ob</yellow> instead of <yellow>/is</yellow>.</red>"
    skyblock:
      world-patterns:
        - "^world_skyblock.*"
      blocked-commands:
        - "/ob"
      blocked-message: "<red>❌ In SkyBlock, use <yellow>/is</yellow> instead of <yellow>/ob</yellow>.</red>"
    laboratorio:
      world-patterns:
        - "^laboratorio.*"
        - "^world_lab.*"
      whitelist-mode: true
      allowed-commands:
        - "/spawn"
        - "/modalidades"
        - "/tpa"
        - "/tpaccept"
        - "/tpdeny"
        - "/plot"
        - "/p"
        - "/drakessuites"
        - "/sf"
        - "/help"
      blocked-commands:
        - "/shop"
        - "/tienda"
        - "/ah"
        - "/auction"
        - "/auctionhouse"
        - "/sm"
        - "/slimemarket"
        - "/sell"
        - "/pay"
        - "/bal"
        - "/balance"
        - "/trade"
        - "/pv"
        - "/vault"
        - "/chest"
        - "/ec"
        - "/enderchest"
        - "/warp minas"
        - "/sf cheat"
        - "/sf give"
      blocked-message: "<red>✦ Star Guard ✦</red> <gray>The command <yellow>{command}</yellow> is blocked in <gold>Laboratory</gold> to prevent economy leaks.</gray>"

# 3. Límites de Generación de Mundo (Chunky & Bedrock Guard)
world-limits:
  overworld-max-radius: 1000000
  nether-max-radius: 500000
  bedrock-warning-radius: 140000
